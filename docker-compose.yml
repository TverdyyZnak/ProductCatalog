
services:
  db:
    image: mysql:8.0
    container_name: productcatalog-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Back-end
      dockerfile: ProductCatalog.API/Dockerfile

    container_name: productcatalog-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AppDBContext: "Server=db;Port=3306;Database=catalog;User=catalog_user;Password=${MYSQL_PASSWORD};"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Front-end/ProductFront
      dockerfile: Dockerfile

    container_name: productcatalog-frontend
    restart: unless-stopped

    ports:
      - "8081:80"

    depends_on:
      - api

volumes:
  mysql_data:
